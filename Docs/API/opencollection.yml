opencollection: 1.0.0

info:
  name: SmartAqua API
docs:
  content: |
    # SmartAqua API

    API untuk provisioning dan simulasi kolam lele.

    ## Base URL

    `http://localhost:8000/api`

    ## Endpoint

    | Method | Path | Keterangan |
    |---|---|---|
    | GET | `/ping` | Cek status API |
    | GET | `/kolam` | Daftar kolam |
    | POST | `/kolam` | Membuat kolam sandbox lengkap |
    | GET | `/kolam/{id}` | Detail kolam + zona + perangkat + jadwal pakan |
    | GET | `/kolam/{id}/lingkungan` | Keadaan lingkungan per zona |
    | POST | `/kolam/{id}/lingkungan/tick` | Jalankan satu tick simulasi lingkungan |
    | POST | `/kolam/{id}/lingkungan/amonia` | Tambahkan beban amonia |
    | POST | `/kolam/{id}/lingkungan/sisa-pakan` | Tambahkan sisa pakan |
    | GET | `/kolam/{id}/ikan` | Ringkasan dan daftar ikan |
    | POST | `/kolam/{id}/ikan/gerak` | Jalankan satu tick gerak ikan |
    | POST | `/kolam/{id}/ikan/proses-harian` | Proses pertumbuhan dan kematian harian |
    | GET | `/kolam/{id}/sampel` | Ambil n ikan hidup secara acak |
    | GET | `/kolam/{id}/sampling` | Daftar sampling |
    | POST | `/kolam/{id}/sampling` | Simpan sampling dan evaluasi rekomendasi |
    | GET | `/kolam/{id}/sampling/{samplingId}` | Detail sampling |
    | PUT/PATCH | `/kolam/{id}/sampling/{samplingId}` | Ubah sampling |
    | DELETE | `/kolam/{id}/sampling/{samplingId}` | Hapus sampling |
    | GET | `/kolam/{id}/alert` | Daftar alert terbaru |
    | GET | `/kolam/{id}/rekomendasi` | Rekomendasi panen terbaru |
    | GET | `/kolam/{id}/validasi` | Ringkasan validasi populasi |
    | POST | `/kolam/{id}/sensor/baca` | Baca sensor yang jatuh tempo |
    | GET | `/kolam/{id}/sensor/terbaru` | Pembacaan terakhir tiap perangkat |
    | GET | `/kolam/{id}/sensor/riwayat` | Riwayat pembacaan sensor |

    ## Autentikasi

    Endpoint sandbox saat ini publik dengan throttle 30 request/menit.
    Setelah Sanctum dipasang, tambahkan `auth:sanctum` pada route dan isi
    variable `token` di environment.
  type: text/markdown
