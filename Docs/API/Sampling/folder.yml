    # Sampling

    Endpoint input manusia untuk mengambil sampel pertumbuhan, menyimpan
    hasil sampling mingguan, dan mengelola riwayat sampling.

    - `GET /api/kolam/{kolamId}/sampel?n=30` — ambil n ikan acak
    - `GET /api/kolam/{kolamId}/sampling` — daftar sampling
    - `POST /api/kolam/{kolamId}/sampling` — simpan hasil sampling
    - `GET /api/kolam/{kolamId}/sampling/{samplingId}` — detail sampling
    - `PUT/PATCH /api/kolam/{kolamId}/sampling/{samplingId}` — ubah sampling
    - `DELETE /api/kolam/{kolamId}/sampling/{samplingId}` — hapus sampling

    ## Status implementasi

    Controller tersedia di:

    `app/Http/Controllers/Api/SamplingController.php`

    Semua route di atas sudah didaftarkan di `routes/api.php`.
    `AnalisisController` juga sudah tersedia, sehingga simpan/ubah sampling
    dapat mengembalikan rekomendasi panen terbaru.

    ## Alur mingguan

    1. Jalankan **Ambil Sampel** untuk mendapat bobot/panjang ikan acak.
    2. Isi hasil timbangan pada **Simpan Sampling**.
    3. Setelah sampling disimpan, rekomendasi panen dievaluasi ulang oleh
       `AnalisisController`.
    4. Gunakan **Daftar Sampling** → **Detail Sampling** untuk melihat
       riwayat, lalu **Ubah/Hapus Sampling** bila perlu koreksi.

    Tanggal sampling memakai `waktu_sandbox_sekarang` dari kolam, bukan
    tanggal nyata.
