http:
  method: POST
  url: "{{baseUrl}}/api/kolam/{{kolamId}}/sampling"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "jumlah_sampel": 30,
        "jumlah_mati": 2,
        "bobot_total_sampel_g": 2651.7,
        "panjang_rata_cm": 17.94
      }
runtime:
  assertions:
    - expression: res.status
