info:
  name: Lihat Lingkungan
  type: http
  seq: 1
  tags:
    - sandbox
    - lingkungan
http:
  method: GET
  url: "{{baseUrl}}/api/kolam/{{kolamId}}/lingkungan"
  headers:
    - name: Accept
      value: application/json
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.kolam.id
      operator: isNumber
    - expression: res.body.zona
      operator: isArray
    - expression: res.body.skenario
      operator: isArray
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |
  # Lihat Lingkungan

  Mengambil keadaan lingkungan terkini untuk satu kolam: suhu, pH, DO,
  amonia, dan sisa pakan per zona, lengkap dengan profil lingkungan dan
  skenario simulasi yang tercatat.

  Gunakan **Buat Kolam** terlebih dahulu atau isi `kolamId` di environment.
  Data contoh C07 sudah tersedia setelah `php artisan migrate --seed`.

  ## Request

  ```http
  GET {{baseUrl}}/api/kolam/{{kolamId}}/lingkungan
  Accept: application/json
  ```

  ## Response 200

  ```json
  {
    "kolam": {
      "id": 4,
      "kode": "C07",
      "nama": "Kolam C07 — Lele Sangkuriang",
      "volume_air_m3": 9,
      "waktu_sandbox_sekarang": "2026-11-08T14:00:00.000000Z"
    },
    "zona": [
      {
        "id": 7,
        "nama": "atas",
        "kedalaman_cm": 50,
        "porsi_volume": 0.4,
        "keadaan": {
          "zona_id": 7,
          "kolam_id": 4,
          "suhu_asli": 28.6,
          "ph_asli": 7.25,
          "do_asli": 2.6,
          "amonia_asli": 0.42,
          "sisa_pakan_g": 12.5,
          "diperbarui_pada": "2026-11-08T14:00:00.000000Z"
        },
        "profil": [
          {
            "parameter": "suhu",
            "nilai_dasar": 28,
            "amplitudo_harian": 2,
            "offset_zona": 0.4
          },
          {
            "parameter": "ph",
            "nilai_dasar": 7.2,
            "amplitudo_harian": 0,
            "offset_zona": 0.1
          }
        ]
      },
      {
        "id": 8,
        "nama": "bawah",
        "kedalaman_cm": 100,
        "porsi_volume": 0.6,
        "keadaan": {
          "zona_id": 8,
          "kolam_id": 4,
          "suhu_asli": 28.2,
          "ph_asli": 7.3,
          "do_asli": 2.4,
          "amonia_asli": 0.55,
          "sisa_pakan_g": 18.2,
          "diperbarui_pada": "2026-11-08T14:00:00.000000Z"
        },
        "profil": []
      }
    ],
    "skenario": [
      {
        "jenis_kejadian": "aerator_mati",
        "besar_dampak": 0.8,
        "mulai": "2026-11-08T12:00:00.000000Z",
        "selesai": "2026-11-08T15:00:00.000000Z",
        "sudah_diterapkan": false
      }
    ]
  }
  ```

  `profil` berisi empat parameter per zona: `suhu`, `ph`, `do`, dan
  `amonia`. Contoh di atas dipersingkat; response sebenarnya memuat
  seluruh profil dan seluruh skenario kolam.

  ## Response 404

  ```json
  { "message": "Kolam tidak ditemukan." }
  ```
