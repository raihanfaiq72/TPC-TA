info:
  name: Atur Status Sensor
  type: http
  seq: 5
  tags:
    - sandbox
    - sensor
http:
  method: PATCH
  url: "{{baseUrl}}/api/kolam/{{kolamId}}/sensor/{{perangkatId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "status": "mati"
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: isString
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |
  # Atur Status Sensor

  Mengaktifkan atau mematikan satu perangkat sensor. Sensor yang dimatikan
  tidak akan menghasilkan pembacaan baru saat **Baca Sensor** dijalankan.

  Nilai `perangkatId` adalah `id` perangkat dari detail kolam, bukan kode
  perangkat.

  ## Request

  ```http
  PATCH {{baseUrl}}/api/kolam/{{kolamId}}/sensor/{{perangkatId}}
  Content-Type: application/json
  Accept: application/json

  {
    "status": "mati"
  }
  ```

  | Field | Tipe | Wajib | Keterangan |
  |---|---|---|---|
  | status | string | ya | `aktif` atau `mati` |

  ## Response 200

  ```json
  {
    "message": "Sensor berhasil dimatikan.",
    "perangkat": {
      "id": 12,
      "kode": "C07-ATAS-DO",
      "kolam_id": 10,
      "zona_id": 23,
      "status": "mati"
    }
  }
  ```

  ## Response 422

  ```json
  {
    "message": "The selected status is invalid.",
    "errors": {
      "status": ["The selected status is invalid."]
    }
  }
  ```

  ## Response 404

  ```json
  { "message": "Perangkat tidak ditemukan." }
  ```
