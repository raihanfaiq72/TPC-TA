info:
  name: Pembacaan Terbaru
  type: http
  seq: 2
  tags:
    - sandbox
    - sensor
http:
  method: GET
  url: "{{baseUrl}}/api/kolam/{{kolamId}}/sensor/terbaru"
  headers:
    - name: Accept
      value: application/json
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |
  # Pembacaan Terbaru

  Mengambil satu pembacaan terakhir untuk **setiap perangkat** pada kolam,
  diurutkan berdasarkan kode perangkat.

  Perangkat yang belum pernah membaca tidak muncul di response. Nilai
  `kualitas_data` bisa `normal`, `outlier`, atau `gagal`.

  ## Request

  ```http
  GET {{baseUrl}}/api/kolam/{{kolamId}}/sensor/terbaru
  Accept: application/json
  ```

  ## Response 200

  ```json
  [
    {
      "perangkat": "C07-ATAS-AMONIA",
      "zona": "atas",
      "parameter": "amonia",
      "nilai": 0.42,
      "satuan": "ppm",
      "waktu_ukur": "2026-11-08 14:00:00",
      "kualitas_data": "normal"
    },
    {
      "perangkat": "C07-ATAS-DO",
      "zona": "atas",
      "parameter": "do",
      "nilai": 18.9,
      "satuan": "mg/L",
      "waktu_ukur": "2026-11-08 12:30:00",
      "kualitas_data": "outlier"
    },
    {
      "perangkat": "C07-LEVEL-01",
      "zona": null,
      "parameter": "level",
      "nilai": 95.8,
      "satuan": "cm",
      "waktu_ukur": "2026-11-08 14:00:00",
      "kualitas_data": "normal"
    }
  ]
  ```

  `zona` bernilai `null` untuk perangkat tingkat kolam seperti sensor level.
  `nilai` juga bisa `null` jika pembacaan terakhir gagal.
