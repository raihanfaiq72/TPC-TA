info:
  name: Proses Harian Ikan
  type: http
  seq: 3
  tags:
    - sandbox
    - ikan
http:
  method: POST
  url: "{{baseUrl}}/api/kolam/{{kolamId}}/ikan/proses-harian"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "tanggal": "2026-11-08"
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.kolam.id
      operator: isNumber
    - expression: res.body.ringkasan.jumlah_total
      operator: isNumber
    - expression: res.body.ikan
      operator: isArray
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |
  # Proses Harian Ikan

  Memproses satu hari virtual yang **baru selesai** untuk seluruh ikan
  pada kolam. Endpoint ini menjalankan:

  1. perhitungan pertumbuhan dan stres harian,
  2. penulisan/updating `ikan_log_harians`,
  3. kematian ikan dan penyebabnya,
  4. penambahan amonia dari bobot bangkai,
  5. reset akumulator harian ikan.

  Ikan hanya diproses jika memiliki `hari_tick_atas + hari_tick_bawah > 0`.
  Karena itu, jalankan **Gerak Ikan** terlebih dahulu minimal satu kali.

  ## Request

  ```http
  POST {{baseUrl}}/api/kolam/{{kolamId}}/ikan/proses-harian
  Content-Type: application/json
  Accept: application/json

  {
    "tanggal": "2026-11-08"
  }
  ```

  | Field | Tipe | Wajib | Keterangan |
  |---|---|---|---|
  | tanggal | date `Y-m-d` | ya | Hari virtual yang baru selesai |

  ## Perhitungan

  ```text
  f_ransum = min(1, pakan_harian_g / (kebutuhan_pakan_harian * bobot_g))
  f_suhu   = faktorSuhu(suhu_rata)
  f_do     = faktorDo(do_rata)
  f_ph     = faktorPh(ph_rata)
  f_amonia = faktorAmonia(amonia_rata)

  SGR_eff  = SGR_maks(bobot) * f_ransum * f_suhu * f_do * f_ph
             * f_amonia * faktor_genetik

  bobot_baru   = bobot_g * exp(SGR_eff / 100)
  panjang_baru = max(panjang_cm, (bobot_baru / koef_a)^(1/3))
  stres_baru   = clamp(stres + stres_naik - pemulihan_stres, 0, 100)
  ```

  Kematian memakai peluang dasar, fungsi stres di atas
  `ambang_stres_mati`, dan peluang kanibalisme untuk ikan kecil dengan
  `faktor_ransum < 0.3`. Bobot ikan mati pada tanggal tersebut menambah
  amonia melalui `tambahAmonia()`.

  ## Response 200

  Response mengikuti bentuk **Lihat Ikan** setelah proses selesai:

  ```json
  {
    "kolam": {
      "id": 4,
      "kode": "C07",
      "volume_air_m3": 9
    },
    "ringkasan": {
      "jumlah_total": 12,
      "jumlah_hidup": 11,
      "jumlah_mati": 1,
      "biomassa_hidup_g": 982.71,
      "bobot_rata_hidup_g": 89.337,
      "stres_rata_hidup": 3.82
    },
    "ikan": [
      {
        "id": 37,
        "kode": "C07-001",
        "bobot_g": 91.9,
        "panjang_cm": 18.22,
        "stres": 1,
        "status": "hidup",
        "zona": { "id": 7, "nama": "atas" }
      }
    ]
  }
  ```

  Angka di atas hanya ilustrasi. Setelah sukses, `hari_tick_atas`,
  `hari_tick_bawah`, `hari_sum_suhu`, `hari_sum_ph`, `hari_sum_do`,
  `hari_sum_amonia`, dan `hari_pakan_g` kembali menjadi `0`.

  ## Response 503

  ```json
  { "message": "Konfigurasi sandbox.ikan belum tersedia." }
  ```

  ## Response 404

  ```json
  { "message": "Kolam tidak ditemukan." }
  ```

  ## Response 422

  ```json
  {
    "message": "The tanggal field must match the format Y-m-d.",
    "errors": {
      "tanggal": ["The tanggal field must match the format Y-m-d."]
    }
  }
  ```
